<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b8321a"><link rel="manifest" href="manifest.json"><title>Bistro POS</title>
<style>

</main><footer>Bistro powered by Electrify Technologies</footer>

 try{const q=(await all('outbox')).filter(x=>x.status==='pending'),count=q.length,records=q.reduce((a,x)=>a+(x.items||[]).length,0),n=$('#net');
  if(!CLOUD){n.textContent='Local only';n.hidden=false;n.classList.add('off');$('#syncTitle').textContent='Cloud connection not configured';$('#syncDetail').textContent='Saved data stays on this device until a cloud endpoint is configured.';$('#syncFill').style.width='0%';return}

/* ---------- cloud sync: idempotent outbox, marked synced only after acknowledgement ---------- */
function pending(){refreshSyncStatus()}
async function post(o){const c=new AbortController(),t=setTimeout(()=>c.abort(),25000);try{const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:API_KEY,...o}),signal:c.signal,redirect:'follow'});let r;try{r=await response.json()}catch(_){throw new Error('Cloud returned an invalid response. Check the deployed /exec URL and deployment version.')}if(!response.ok||!r||r.ok!==true)throw new Error((r&&r.error)||('Cloud request failed ('+response.status+').'));return r}finally{clearTimeout(t)}}
/* One sync at a time (queued). The outbox is sent oldest first in chunks; a batch is marked synced ONLY when the cloud
   acknowledges it. Anything not acknowledged stays pending and is re-sent (the cloud ignores repeats by batch id). */
let sq=Promise.resolve(),inflight=0;
function sync(pull){inflight++;const run=async()=>{try{return await syncOnce(pull)}finally{inflight--}};sq=sq.then(run,run);return sq}
async function syncOnce(pull){if(!CLOUD||!navigator.onLine){await refreshSyncStatus();return false}
